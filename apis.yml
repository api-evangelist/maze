aid: maze
name: Maze
description: >-
  Maze is a continuous product-discovery and user-research platform that lets
  product teams run usability tests, prototype tests, surveys, card sorts, tree
  tests, and live interviews at scale, then turn the results into shareable,
  research-grade insight. Founded in 2018 and headquartered in London, Maze
  integrates with design tools like Figma and collaboration tools like Slack,
  Notion, and Jira, and layers research-grade AI over its testing and reporting
  surface. The company is venture-backed (Amplify Partners, Emergence Capital,
  Felicis, General Catalyst, Partech, Seedcamp) and operates a SOC 2 Type II
  certified, GDPR-aligned SaaS. Maze does not currently publish a public
  developer REST API; its extensibility is delivered through first-party
  product integrations and SSO. This profile captures Maze's identity, security
  posture, and operational surface for the API Evangelist network.
